<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Tab Monitor Settings</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #1e1e2e; color: #cdd6f4; padding: 24px; max-width: 400px; }
    h2 { color: #89b4fa; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 8px; }
    input[type="number"] { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #45475a; background-color: #313244; color: #cdd6f4; }
    button { padding: 10px 16px; background-color: #a6e3a1; color: #11111b; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    button:hover { background-color: #94e2d5; }
    #status { margin-left: 12px; color: #a6e3a1; display: none; }
  </style>
</head>
<body>
  <h2>Settings</h2>
  <div class="form-group">
    <label for="threshold">Tab Count Threshold (Warning limit):</label>
    <input type="number" id="threshold" min="1" max="1000">
  </div>
  <button id="saveBtn">Save Settings</button>
  <span id="status">Saved!</span>
  
  <script src="options.js"></script>
</body>
</html>
