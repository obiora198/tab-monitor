<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Tab Monitor</title>
  <style>
    body { width: 300px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e2e; color: #cdd6f4; padding: 16px; margin: 0; }
    h2 { margin-top: 0; font-size: 18px; color: #89b4fa; }
    .stat { display: flex; justify-content: space-between; margin-bottom: 8px; }
    .value { font-weight: bold; color: #a6e3a1; }
    button { width: 100%; padding: 10px; background-color: #f38ba8; color: #11111b; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 16px; }
    button:hover { background-color: #eba0ac; }
    button:disabled { background-color: #585b70; cursor: not-allowed; }
  </style>
</head>
<body>
  <h2>Tab Monitor Scout</h2>
  <div class="stat">
    <span>Open Tabs:</span>
    <span id="tabCount" class="value">...</span>
  </div>
  <div class="stat">
    <span>System Memory:</span>
    <span id="sysMemory" class="value">...</span>
  </div>
  
  <button id="closeRecommendedBtn">Close Recommended Tabs</button>
  
  <script type="module" src="popup.js"></script>
</body>
</html>
