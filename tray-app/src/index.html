<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tab Monitor</title>
  <style>
    :root {
      --bg-color: rgba(30, 30, 46, 0.96);
      --text-color: #cdd6f4;
      --accent: #f38ba8;
      --border-radius: 14px;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: transparent !important;
      background-color: transparent !important;
      box-shadow: none !important;
      border: none !important;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: var(--text-color);
      display: flex;
      justify-content: flex-end;
      align-items: flex-end;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    /* Smooth Slide & Scale Entrance Animation */
    @keyframes slideInFromRight {
      0% {
        opacity: 0;
        transform: translateY(40px) scale(0.93);
      }

      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .app-container {
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      gap: 0;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      padding: 10px;
      background: transparent !important;
      box-shadow: none !important;
      border: none !important;
      animation: slideInFromRight 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Avatar Container */
    .avatar-widget {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-end;
      width: 420px;
      min-width: 420px;
      margin-right: -50px;
      margin-bottom: 75px;
      z-index: 10;
      pointer-events: none;
      background: transparent !important;
      box-shadow: none !important;
    }

    .avatar-container {
      width: 420px;
      height: 420px;
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      background: transparent !important;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: bottom right;
      transition: opacity 0.35s ease-in-out, transform 0.35s ease-in-out;
      filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.4));
    }

    /* Memory Warning Card */
    .overlay {
      background-color: #1e1e2e;
      border: 2px solid var(--accent);
      border-radius: var(--border-radius);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      width: 400px;
      min-width: 400px;
      height: 480px;
      box-sizing: border-box;
      padding: 18px;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 1;
    }

    h2 {
      margin: 0 0 6px 0;
      color: var(--accent);
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .message {
      font-size: 0.85rem;
      margin-bottom: 8px;
      color: #bac2de;
      line-height: 1.3;
    }

    /* Progress bar */
    .progress-container {
      margin-bottom: 10px;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: #6c7086;
      margin-bottom: 4px;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: rgba(17, 17, 27, 0.6);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.35s ease, background-color 0.35s ease;
      width: 100%;
    }

    /* Main Scroll Area */
    .content-scroll {
      flex-grow: 1;
      overflow-y: auto;
      margin-bottom: 10px;
      background: rgba(17, 17, 27, 0.5);
      border-radius: 8px;
      padding: 6px;
    }

    /* Section Header */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.78rem;
      font-weight: 600;
      color: #a6adc8;
      padding: 6px 4px;
      cursor: pointer;
      user-select: none;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      margin-top: 4px;
    }

    .section-header:first-child {
      border-top: none;
      margin-top: 0;
    }

    .section-header:hover {
      color: #cdd6f4;
    }

    .section-header .chevron {
      transition: transform 0.2s;
    }

    .section-header.collapsed .chevron {
      transform: rotate(-90deg);
    }

    .tab-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
      font-size: 0.82rem;
      padding: 6px 8px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 4px;
      border-left: 2px solid #585b70;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      user-select: none;
      position: relative;
    }

    .tab-item:last-child {
      margin-bottom: 0;
    }

    .tab-item:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .tab-item.selected {
      border-left-color: #a6e3a1;
      background: rgba(166, 227, 161, 0.08);
    }

    /* Custom checkbox */
    .tab-checkbox {
      width: 15px;
      height: 15px;
      min-width: 15px;
      border-radius: 3px;
      border: 2px solid #585b70;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .tab-item.selected .tab-checkbox {
      border-color: #a6e3a1;
      background: #a6e3a1;
    }

    .tab-checkbox svg {
      opacity: 0;
      transition: opacity 0.15s;
    }

    .tab-item.selected .tab-checkbox svg {
      opacity: 1;
    }

    .tab-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    /* Pop-out icon on hover */
    .tab-popout {
      opacity: 0;
      padding: 2px 4px;
      border-radius: 4px;
      color: #89b4fa;
      cursor: pointer;
      transition: opacity 0.15s, background 0.15s;
      display: flex;
      align-items: center;
    }

    .tab-item:hover .tab-popout {
      opacity: 1;
    }

    .tab-popout:hover {
      background: rgba(137, 180, 250, 0.2);
      color: #b4befe;
    }

    /* Desktop Apps */
    .desktop-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 4px;
      margin-bottom: 4px;
      font-size: 0.8rem;
      border-left: 2px solid #fab387;
    }

    .desktop-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    .desktop-mem {
      font-size: 0.73rem;
      color: #f9e2af;
      margin-left: 6px;
    }

    .desktop-actions {
      display: flex;
      gap: 4px;
      align-items: center;
      margin-left: 6px;
    }

    .desktop-btn {
      padding: 2px 5px;
      border-radius: 4px;
      cursor: pointer;
      opacity: 0.8;
      font-size: 0.72rem;
      display: flex;
      align-items: center;
    }

    .desktop-btn:hover {
      opacity: 1;
    }

    .desktop-focus {
      color: #89b4fa;
      background: rgba(137, 180, 250, 0.15);
    }

    .desktop-close {
      color: #f38ba8;
      background: rgba(243, 139, 168, 0.15);
    }

    /* Select all row */
    .select-all {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      color: #6c7086;
      padding: 2px 0 6px 0;
      cursor: pointer;
      user-select: none;
      transition: color 0.15s;
    }

    .select-all:hover {
      color: #a6adc8;
    }

    /* Actions */
    .actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    button {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.85rem;
    }

    .btn-primary {
      background-color: var(--accent);
      color: #11111b;
    }

    .btn-primary:hover {
      background-color: #eba0ac;
      box-shadow: 0 0 10px rgba(243, 139, 168, 0.4);
    }

    .btn-primary:disabled {
      background-color: #45475a;
      color: #6c7086;
      cursor: default;
      box-shadow: none;
    }

    .btn-secondary {
      background-color: #45475a;
      color: #cdd6f4;
    }

    .btn-secondary:hover {
      background-color: #585b70;
    }

    .close-count {
      font-size: 0.75rem;
      color: #6c7086;
      margin-right: auto;
      align-self: center;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 5px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.1);
    }

    ::-webkit-scrollbar-thumb {
      background: #45475a;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #585b70;
    }
  </style>
</head>

<body>
  <div class="app-container">
    <!-- Avatar (Left side) -->
    <div class="avatar-widget">
      <div class="avatar-container">
        <img id="avatarImg" src="./assets/point_at_you_bubble.png" alt="Avatar" class="avatar-img" />
      </div>
    </div>

    <!-- Memory Warning Box (Right side) -->
    <div class="overlay">
      <h2>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
          <line x1="12" y1="9" x2="12" y2="13"></line>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
        Memory Warning
      </h2>
      <div class="message">You have <strong id="tabCount">...</strong> tabs open. Select tabs to close:</div>

      <div class="progress-container">
        <div class="progress-label">
          <span id="progressLabel">Tabs left after cleanup</span>
          <span id="progressCount">...</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>

      <div class="content-scroll">
        <!-- Suggested Tabs Section -->
        <div class="section-header" id="suggestedHeader">
          <span>Suggested Tabs to Close (<span id="suggestedCount">0</span>)</span>
          <span class="chevron">▼</span>
        </div>
        <div id="suggestedContainer">
          <div class="select-all" id="selectAll">
            <div class="tab-checkbox" id="selectAllCheck">
              <svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="#11111b" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <polyline points="2 6 5 9 10 3"></polyline>
              </svg>
            </div>
            Select all suggested
          </div>
          <div id="suggestedList"></div>
        </div>

        <!-- Other Tabs Section (Collapsed) -->
        <div class="section-header collapsed" id="otherHeader">
          <span>Other Open Tabs (<span id="otherCount">0</span>)</span>
          <span class="chevron">▼</span>
        </div>
        <div id="otherContainer" style="display: none;">
          <div id="otherList"></div>
        </div>

        <!-- Desktop Apps Section -->
        <div class="section-header" id="desktopHeader">
          <span>Heavy Desktop Apps (<span id="desktopCount">0</span>)</span>
          <span class="chevron">▼</span>
        </div>
        <div id="desktopContainer">
          <div id="desktopList"></div>
        </div>
      </div>

      <div class="actions">
        <span class="close-count" id="closeCountLabel"></span>
        <button class="btn-secondary" id="dismissBtn">Ignore</button>
        <button class="btn-primary" id="closeBtn" disabled>Close Selected</button>
      </div>
    </div>
  </div>
  <script src="/main.js"></script>
</body>

</html>
